name: Android TV APK

on:
  push:
    branches: [main]
    paths-ignore:
      - PROJECT_STATUS.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release
          if [ -n "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" | base64 --decode | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_KEYSTORE_PASSWORD -out "$RUNNER_TEMP/einthusan-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/einthusan-release.jks"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-einthusan-tv}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            gradle --no-daemon :app:assembleRelease -x lintVitalAnalyzeRelease -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk release/EinthusanTV-preview.apk
            echo "Built stable-key signed APK."
          else
            echo "::warning::Signing secrets are not configured. Building a temporary debug APK; in-place updates will not work reliably until stable signing is configured."
            gradle --no-daemon :app:assembleDebug -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk release/EinthusanTV-preview.apk
          fi

      - name: Update project handover
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          cat > PROJECT_STATUS.md <<'STATUS_EOF'
# EinthusanTV — Project Handover

_Last generated by the Android TV APK GitHub Actions workflow._

## Repository
- GitHub: https://github.com/Vijaye82/EinthusanTV
- Main branch: `main`
- App: Android TV / Fire TV application, Kotlin and Jetpack Compose

## Latest build checkpoint
- Workflow run: #${{ github.run_number }}
- Build result: ${{ job.status }}
- Source commit: ${{ github.sha }}
- Workflow: https://github.com/Vijaye82/EinthusanTV/actions/runs/${{ github.run_id }}
- APK: attached to the workflow run as `EinthusanTV-preview-apk` and published as a prerelease.

## Current product direction
Give the existing EinthusanTV interface a Netflix-inspired TV presentation while retaining Einthusan branding, existing features and Android TV / Fire TV remote usability.

## Implemented areas
- Compose-based Android TV interface, catalogue browsing, language and genre filters, search and My List.
- Movie detail screen and Media3 / ExoPlayer playback screen.
- Einthusan account sign-in flow and direct playback resolution integration.
- Catalogue model carries the Einthusan source ID separately from IMDb/catalogue IDs.
- Netflix-inspired visual refresh started: dark/black surfaces, red accent, featured hero banner, horizontal content shelves and taller poster cards.

## Current work / next steps
1. Verify the latest Android build succeeds; inspect its Actions logs if it fails.
2. Refine D-pad / remote focus states and navigation across the Netflix-style home and shelves.
3. Test on an actual Android TV / Fire TV device, including catalogue loading, sign-in and authorised playback.
4. Capture real device screenshots once the app is running on a TV device.
5. Keep this handover current as features and build status change.

## Important testing notes
- A successful CI build confirms compilation and packaging, not live Einthusan sign-in or stream playback.
- Direct playback still requires real account/session testing.
- The quality selector offers Auto, HD and UHD; do not assume Auto and HD are distinct stream variants without verification.
- Confirm the signing configuration before relying on seamless in-place APK updates. Without the stable signing secrets, CI falls back to a debug-signed APK.

## Working agreement
- Treat the GitHub repository and latest Actions runs as the source of truth.
- Before editing, inspect the current files, latest commits and build status.
- Make changes directly in the repository, commit them, and verify the resulting build.
- Update this file when priorities, implementation status or known issues change.
- Do not repeat already completed work; continue from the latest verified checkpoint.
STATUS_EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Update project handover for build ${GITHUB_RUN_NUMBER}"
            git push origin HEAD:main
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EinthusanTV-preview-apk
          path: release/EinthusanTV-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: EinthusanTV Preview Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release/EinthusanTV-preview.apk
